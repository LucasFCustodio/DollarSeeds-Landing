<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Termly consent banner + Auto Blocker.
       Must stay the FIRST script tag on the page (ahead of the policy embed
       script below), and ahead of the font/resource link tags. -->
  <script src="https://app.termly.io/resource-blocker/7c89c6bf-1b30-4ac5-801a-a17454fe74f6?autoBlock=on"></script>

  <title>Privacy Policy — DollarSeeds</title>
  <meta name="description" content="How DollarSeeds collects, uses, stores, and shares your personal information, and the privacy rights and choices you have." />
  <link rel="canonical" href="https://dollarseeds.netlify.app/privacy" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://app.termly.io" />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@100..900&family=Figtree:wght@300..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F5F1E6;
      --forest: #0F3D2E;
      --dark: #0A1612;
      --emerald: #10B981;
      --amber: #C2701C;
      --violet: #7C3AED;
      --harvest: #F4D35E;
      --muted: #6B7280;
      --display: 'Urbanist', system-ui, sans-serif;
      --sans: 'Figtree', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    html { scroll-behavior: smooth; }
    body { font-family: var(--sans); font-weight: 400; background: var(--cream); color: var(--forest); overflow-x: hidden; }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 1rem 2.5rem;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(250,247,238,0.88);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(15,61,46,0.08);
    }
    .nav-logo { display: flex; align-items: center; gap: 0.625rem; text-decoration: none; }
    .nav-logo-icon {
      width: 36px; height: 36px; background: var(--forest); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(16,185,129,0.3);
    }
    .nav-logo-name { font-family: var(--display); font-size: 1.125rem; font-weight: 580; color: var(--forest); letter-spacing: 0; }
    .nav-cta {
      background: var(--emerald); color: var(--dark);
      font-family: var(--sans); font-size: 0.875rem; font-weight: 600;
      padding: 0.5rem 1.375rem; border-radius: 999px; text-decoration: none;
      transition: opacity 0.2s, transform 0.15s;
    }
    .nav-cta:hover { opacity: 0.88; transform: translateY(-1px); }

    /* HEADER */
    .legal-header {
      background: linear-gradient(to bottom, #FAF7EE, var(--cream)); padding: 8rem 2.5rem 3.5rem;
      border-bottom: 1px solid rgba(15,61,46,0.065);
      position: relative; overflow: hidden;
    }
    .legal-header-blob {
      position: absolute; width: 460px; height: 460px; background: var(--emerald);
      border-radius: 50%; filter: blur(110px); opacity: 0.07; top: -160px; right: -120px; pointer-events: none;
    }
    .legal-header-inner { max-width: 820px; margin: 0 auto; position: relative; z-index: 1; }
    .legal-eyebrow {
      font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.15em;
      text-transform: uppercase; color: #0B8A61; margin-bottom: 1rem;
    }
    .legal-title {
      font-family: var(--display); font-size: clamp(1.7rem, 3vw, 2.3rem);
      font-weight: 580;
      color: var(--forest); line-height: 1.13; letter-spacing: -0.005em; margin-bottom: 0.75rem;
    }
    .legal-meta { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.06em; color: var(--muted); }

    /* CONTENT */
    .legal-body { padding: 4rem 2.5rem 5rem; }
    .legal-inner { max-width: 760px; margin: 0 auto; }

    /* TERMLY DOCUMENT — the embed injects Termly's markup into the container below.
       Termly's own rules use !important, so these overrides are scoped under
       .termly-doc to win on specificity. min-height reserves space while loading. */
    .termly-doc { overflow-wrap: break-word; min-height: 60vh; }
    .termly-doc [data-custom-class='title'], .termly-doc [data-custom-class='title'] * {
      font-family: var(--display) !important; font-size: 2rem !important; font-weight: 580 !important;
      color: var(--forest) !important; line-height: 1.15 !important; letter-spacing: -0.005em !important;
    }
    .termly-doc [data-custom-class='subtitle'], .termly-doc [data-custom-class='subtitle'] * {
      font-family: var(--mono) !important; font-size: 0.75rem !important;
      color: var(--muted) !important; letter-spacing: 0.05em !important;
    }
    .termly-doc [data-custom-class='heading_1'], .termly-doc [data-custom-class='heading_1'] * {
      font-family: var(--display) !important; font-size: 1.5rem !important; font-weight: 580 !important;
      line-height: 1.15 !important; letter-spacing: -0.005em !important; color: var(--forest) !important;
    }
    .termly-doc [data-custom-class='heading_2'], .termly-doc [data-custom-class='heading_2'] * {
      font-family: var(--display) !important; font-size: 1.0625rem !important;
      font-weight: 580 !important; line-height: 1.15 !important; letter-spacing: 0 !important;
      color: var(--forest) !important;
    }
    .termly-doc [data-custom-class='body_text'], .termly-doc [data-custom-class='body_text'] * {
      font-family: var(--sans) !important; font-size: 1rem !important; color: #414B54 !important;
    }
    .termly-doc [data-custom-class='link'], .termly-doc [data-custom-class='link'] * {
      font-family: var(--sans) !important; color: var(--emerald) !important;
    }
    .termly-doc a { color: var(--emerald); text-decoration: underline; text-underline-offset: 2px; word-break: break-word; }
    .termly-doc ul, .termly-doc ol { margin: 0 0 1rem 1.5rem; }
    .termly-doc li { line-height: 1.75; margin-bottom: 0.4rem; }
    .termly-doc div, .termly-doc span { line-height: 1.75; }
    .termly-doc table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
    .termly-doc td, .termly-doc th { border: 1px solid rgba(15,61,46,0.12); padding: 0.5rem 0.65rem; text-align: left; }
    .termly-doc img { max-width: 100%; height: auto; }

    /* Fallback shown only when JavaScript is unavailable */
    .embed-fallback {
      background: rgba(16,185,129,0.06); border-left: 3px solid var(--emerald);
      border-radius: 0 12px 12px 0; padding: 1.25rem 1.5rem;
    }
    .embed-fallback p { font-size: 1rem; color: #414B54; line-height: 1.8; margin-bottom: 0.5rem; }
    .embed-fallback a { color: var(--emerald); text-decoration: underline; text-underline-offset: 2px; word-break: break-word; }

    /* FOOTER */
    .legal-footer { background: #D7CEB2; border-top: 1px solid rgba(15,61,46,0.08); padding: 3rem 2.5rem; }
    .legal-footer-inner {
      max-width: 760px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    }
    .legal-footer-links { display: flex; gap: 1.5rem; flex-wrap: wrap; }
    .legal-footer-links a { font-size: 0.85rem; color: #41564C; text-decoration: none; font-family: var(--sans); }
    .legal-footer-links a:hover { color: #0B8A61; }
    .legal-footer-copy { font-size: 0.775rem; color: #6B7280; font-family: var(--mono); letter-spacing: 0.04em; }

    @media (max-width: 640px) {
      nav { padding: 0.875rem 1.25rem; }
      .legal-header { padding: 7rem 1.25rem 3rem; }
      .legal-body { padding: 3rem 1.25rem 4rem; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>

        <path d="M9 11v9" stroke="#0F3D2E" stroke-width="1.5" stroke-linecap="round"/>

    <span class="nav-logo-name">DollarSeeds</span>

</header>

<!-- CONTENT -->
<main class="legal-body">

      <div name="termly-embed" data-id="3e08baf8-dbec-422f-879a-5d6202ce8329"></div>

              View the DollarSeeds Privacy Policy
            </a>
          </p>
          <p>Or request a copy by email: <a href="mailto:lucasquality555@gmail.com">lucasquality555@gmail.com</a></p>
        </div>
      </noscript>
    </div>
  </div>
</main>
<script src="https://app.termly.io/embed-policy.min.js" async></script>

<!-- FOOTER -->
<footer class="legal-footer">
  <div class="legal-footer-inner">
    <div class="legal-footer-links">
      <a href="/">Home</a>
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Service</a>
      <a href="/cookie-policy">Cookie Policy</a>
      <a href="/delete-account">Delete Account</a>
      <a href="#" class="termly-display-preferences">Consent Preferences</a>
    </div>
    <p class="legal-footer-copy">© 2026 Lucas Fracasso Custodio</p>
  </div>
</footer>

</body>
</html>
