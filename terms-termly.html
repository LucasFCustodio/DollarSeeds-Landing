    /* ------------------------------------------------------------
       FONTS — self-hosted, Latin subset, VARIABLE (wght axis intact).
       This page carries its own copy of the base styles, so it needs its
       own @font-face rules. Headings use font-weight: 580, which only a
       variable face resolves; never swap in static instances.
       Regenerate the files with `npm run fonts`.
       ------------------------------------------------------------ */
    @font-face {
      font-family: 'Urbanist'; font-style: normal; font-weight: 100 900; font-display: swap;
      src: url('/assets/fonts/urbanist-latin-var.woff2') format('woff2-variations'),
           url('/assets/fonts/urbanist-latin-var.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Figtree'; font-style: normal; font-weight: 300 900; font-display: swap;
      src: url('/assets/fonts/figtree-latin-var.woff2') format('woff2-variations'),
           url('/assets/fonts/figtree-latin-var.woff2') format('woff2');
    }
    @font-face {
      font-family: 'JetBrains Mono'; font-style: normal; font-weight: 100 800; font-display: swap;
      src: url('/assets/fonts/jetbrains-mono-latin-var.woff2') format('woff2-variations'),
           url('/assets/fonts/jetbrains-mono-latin-var.woff2') format('woff2');
    }

    /* ------------------------------------------------------------
       METRIC-MATCHED FALLBACKS
       Generated by tools/gen-font-fallbacks.js — do not hand-tune.

       With font-display: swap the browser paints text in a fallback
       face first, then repaints in the real one. These rules make the
       fallback occupy exactly the same space as the webfont, so that
       repaint does not re-wrap the nav or move the hero. Removing them
       costs roughly 0.1 CLS on mobile.
       ------------------------------------------------------------ */
    @font-face {
      font-family: 'Urbanist Fallback';
      src: local('Arial'), local('Helvetica');
      size-adjust: 93.37%;
      ascent-override: 101.74%;
      descent-override: 26.77%;
      line-gap-override: 0%;
    }
    @font-face {
      font-family: 'Figtree Fallback';
      src: local('Arial'), local('Helvetica');
      size-adjust: 100.00%;
      ascent-override: 95.00%;
      descent-override: 25.00%;
      line-gap-override: 0%;
    }
    @font-face {
      font-family: 'JetBrains Mono Fallback';
      src: local('Arial'), local('Helvetica');
      size-adjust: 113.23%;
      ascent-override: 90.08%;
      descent-override: 26.49%;
      line-gap-override: 0%;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {

    }

    html { scroll-behavior: smooth; }
    body { font-family: var(--sans); font-weight: 400; background: var(--cream); color: var(--forest); overflow-x: hidden; }

    nav {

    /* TERMLY DOCUMENT — the embed injects Termly's markup (same data-custom-class
       scheme as their static exports) into the container below. Termly's own rules
       use !important, so these overrides are scoped under .termly-doc to win on
       specificity. min-height reserves space so the page doesn't jump while loading. */
    .termly-doc { overflow-wrap: break-word; min-height: 60vh; }
    .termly-doc [data-custom-class='title'], .termly-doc [data-custom-class='title'] * {
      font-family: var(--display) !important; font-size: 2rem !important; font-weight: 580 !important;
      color: var(--forest) !important; line-height: 1.15 !important; letter-spacing: -0.005em !important;
    }
    .termly-doc [data-custom-class='subtitle'], .termly-doc [data-custom-class='subtitle'] * {
      font-family: var(--mono) !important; font-size: 0.75rem !important;
      color: var(--muted) !important; letter-spacing: 0.05em !important;
    }
    .termly-doc [data-custom-class='heading_1'], .termly-doc [data-custom-class='heading_1'] * {
      font-family: var(--display) !important; font-size: 1.5rem !important; font-weight: 580 !important;
      line-height: 1.15 !important; letter-spacing: -0.005em !important; color: var(--forest) !important;
    }
    .termly-doc [data-custom-class='heading_2'], .termly-doc [data-custom-class='heading_2'] * {
      font-family: var(--display) !important; font-size: 1.0625rem !important;
      font-weight: 580 !important; line-height: 1.15 !important; letter-spacing: 0 !important;
      color: var(--forest) !important;
    }
    .termly-doc [data-custom-class='body_text'], .termly-doc [data-custom-class='body_text'] * {
      font-family: var(--sans) !important; font-size: 1rem !important; color: #414B54 !important;
    }
    .termly-doc [data-custom-class='link'], .termly-doc [data-custom-class='link'] * {
      font-family: var(--sans) !important; color: var(--emerald) !important;
    }
    .termly-doc a { color: var(--emerald); text-decoration: underline; text-underline-offset: 2px; word-break: break-word; }
    .termly-doc ul, .termly-doc ol { margin: 0 0 1rem 1.5rem; }
    .termly-doc li { line-height: 1.75; margin-bottom: 0.4rem; }
    .termly-doc div, .termly-doc span { line-height: 1.75; }
    .termly-doc table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
    .termly-doc td, .termly-doc th { border: 1px solid rgba(15,61,46,0.12); padding: 0.5rem 0.65rem; text-align: left; }
    .termly-doc img { max-width: 100%; height: auto; }

    /* Fallback shown only when JavaScript is unavailable */
    .embed-fallback {
      background: rgba(16,185,129,0.06); border-left: 3px solid var(--emerald);
      border-radius: 0 12px 12px 0; padding: 1.25rem 1.5rem;
    }
    .embed-fallback p { font-size: 1rem; color: #414B54; line-height: 1.8; margin-bottom: 0.5rem; }
    .embed-fallback a { color: var(--emerald); text-decoration: underline; text-underline-offset: 2px; word-break: break-word; }

    /* FOOTER */
    .legal-footer { background: #D7CEB2; border-top: 1px solid rgba(15,61,46,0.08); padding: 3rem 2.5rem; }
    .legal-footer-inner {
      max-width: 760px; margin: 0 auto;
